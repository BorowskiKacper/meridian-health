[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emr-backend"
version = "0.1.0"
description = "Hackathon EMR backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "python-dotenv",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "pgvector",
    "httpx",
    "google-genai",
    "twilio",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
